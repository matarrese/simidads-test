
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMID Resize POC</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #console {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      background: #1e1e1e;
      border: 2px solid red;
    }
    .log-entry {
      margin-bottom: 5px;
      border-bottom: 1px solid #333;
      padding-bottom: 2px;
    }
    .error { color: #ff6b6b; }
    .success { color: #51cf66; }
    .info { color: #ffd43b; }
    button {
      padding: 10px;
      background: #2b8a3e;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { background: #2f9e44; }
  </style>
</head>
<body>
  <button id="resize-btn">Trigger requestResize</button>
  <div id="console">
    <div class="log-entry info">POC initialized. Waiting for SIMID events...</div>
  </div>

  <!-- SIMID Scripts -->
  <script src="../common/simid_protocol.js"></script>
  <script src="../common/base_simid_creative.js"></script>
  <script src="./simid_resize_poc.js"></script>
</body>
</html>
